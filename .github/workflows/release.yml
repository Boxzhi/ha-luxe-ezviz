name: Release Luxe EZVIZ

on:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate integration version and EZUIKit pins
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/luxe_ezviz
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/luxe_ezviz/manifest.json > /dev/null
          python -m json.tool custom_components/luxe_ezviz/sdk_hashes.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/luxe_ezviz/manifest.json").read_text())
          sdk = json.loads(Path("custom_components/luxe_ezviz/sdk_hashes.json").read_text())
          assert manifest["domain"] == "luxe_ezviz"
          assert manifest["version"] == "1.2.0"
          assert sdk["version"] == "9.0.24"
          assert len(sdk["files"]) == 12
          assert "ezuikit_static/libSystemTransformWASM.js" in sdk["files"]
          assert not any(name.startswith("ezuikit_static/talk/") for name in sdk["files"])
          assert all(
              isinstance(pin, dict)
              and isinstance(pin.get("git_blob_sha"), str)
              and isinstance(pin.get("size"), int)
              for pin in sdk["files"].values()
          )
          assert "luxe_ezviz_sdk" in Path("custom_components/luxe_ezviz/sdk.py").read_text()
          player = Path("custom_components/luxe_ezviz/frontend/player.html").read_text()
          assert 'id="record"' in player and "downloadRecord:false" in player
          assert "recordOptions:{enabledWatermarkRecord:false}" in player
          print(f"Luxe EZVIZ {manifest['version']} / EZUIKit 9.0.24 metadata is consistent.")
          PY
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JavaScript
        run: |
          set -euo pipefail
          node --check custom_components/luxe_ezviz/frontend/luxe-ezviz-card.js
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("custom_components/luxe_ezviz/frontend/player.html").read_text()
          scripts = [
              item for item in re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", source, re.I)
              if item.strip()
          ]
          if not scripts:
              raise SystemExit("No inline player scripts found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/luxe-player-{index}.js").write_text(script)
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for script in /tmp/luxe-player-*.js; do node --check "$script"; done
          node --test tests/test_mp4_metadata_repair.mjs

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release:
    needs: [validate, hacs, hassfest]
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/luxe_ezviz/manifest.json"))["version"])')"
          SDK_VERSION="$(python -c 'import json; print(json.load(open("custom_components/luxe_ezviz/sdk_hashes.json"))["version"])')"
          test "$SDK_VERSION" = "9.0.24"
          TAG="v$VERSION"
          ZIP="luxe-ezviz-$TAG.zip"
          PRERELEASE=false
          MAKE_LATEST=true
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            MAKE_LATEST=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
      - name: Build HACS-compatible integration ZIP
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          mkdir -p dist/luxe_ezviz
          cp -a custom_components/luxe_ezviz/. dist/luxe_ezviz/
          (cd dist && zip -qr "../$ZIP_NAME" luxe_ezviz)
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Luxe EZVIZ v${{ steps.meta.outputs.version }} — EZUIKit 9.0.24
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft: false
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: false
          body: |
            ## Luxe EZVIZ v${{ steps.meta.outputs.version }}

            Stable v1.2.0 release, based on v1.2.0-beta.2 after real-device regression of local recording and MP4 metadata repair.

            - Preserves the existing integration domain, saved config entries, API routes, card type, audio exclusivity, talk coordination, PTZ controls, and playback lifecycle.
            - Supports per-camera local recording with a 30-minute maximum, a 25-minute warning, and independent recording timers. Multiple cameras may record concurrently.
            - Uses EZUIKit 9.0.24 with SDK auto-download disabled; completed recording Blobs are passed to the page-level serial download queue.
            - Preserves camera-source audio in recordings independently of the live playback mute state.
            - Adds conservative AVC/HEVC MP4 metadata validation. Only unambiguous zero-valued Sample Entry and/or tkhd dimensions are repaired from the codec SPS; valid files remain byte-for-byte unchanged. No remuxing or transcoding is performed.
            - Refines recording controls with a left-facing camera icon, white idle outline, red recording center, and a compact translucent elapsed-time label. The REC text is removed; the 25-minute warning uses amber styling.
            - Recording controls remain hidden when the active EZUIKit player does not expose both recording methods.
            - Download triggers are serialized with a short gap because browsers do not expose a reliable download-completed event.
            - Player teardown attempts to stop and hand off recordings before releasing the player. Force-closing the browser or HA app can still interrupt an unfinished save.

            ### Install or update through HACS
            1. Open HACS and select Luxe EZVIZ.
            2. Install or update to stable v${{ steps.meta.outputs.version }}.
            3. Restart Home Assistant.
            4. If using YAML Lovelace resources, update the module URL to /luxe_ezviz/static/luxe-ezviz-card.js?v=1.2.0-ezuikit-9.0.24.

            Existing integration configuration and dashboard YAML remain unchanged.
          files: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.zip }}.sha256

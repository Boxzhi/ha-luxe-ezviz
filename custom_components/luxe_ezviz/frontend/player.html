<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script>
    // Mic permission gate, restored from the probe26 approach and hardened for
    // browsers that expose getUserMedia through the MediaDevices prototype.
    // No microphone permission or stream is requested during regular playback.
    (()=>{
      const key='__luxeEzvizMicGate';
      if(window[key])return;
      let talkIntent=false;
      const marker='__luxeEzvizMicGateWrapped';
      const blockedError=()=>{
        try{return new DOMException('麦克风仅在用户主动开始对讲后允许访问','NotAllowedError');}
        catch(_){const e=new Error('麦克风仅在用户主动开始对讲后允许访问');e.name='NotAllowedError';return e;}
      };
      const needsAudio=constraints=>Boolean(constraints&&typeof constraints==='object'&&constraints.audio);
      const wrap=(target,name,legacy=false)=>{
        if(!target)return false;
        let original;
        try{original=target[name];}catch(_){return false;}
        if(typeof original!=='function')return true;
        if(original[marker])return true;
        const guarded=function(...args){
          if(needsAudio(args[0])&&!talkIntent){
            const error=blockedError();
            if(legacy){
              // Legacy getUserMedia(constraints, success, failure) uses a callback.
              if(typeof args[2]==='function'){try{args[2](error);}catch(_){}}
              return;
            }
            return Promise.reject(error);
          }
          return original.apply(this,args);
        };
        try{Object.defineProperty(guarded,marker,{value:true});}catch(_){guarded[marker]=true;}
        try{
          Object.defineProperty(target,name,{configurable:true,enumerable:false,writable:true,value:guarded});
          if(target[name]===guarded)return true;
        }catch(_){}
        try{target[name]=guarded;if(target[name]===guarded)return true;}catch(_){}
        return false;
      };
      const install=()=>{
        const md=navigator.mediaDevices;
        // Install on both the actual MediaDevices object and its prototype;
        // third-party code can invoke MediaDevices.prototype.getUserMedia directly.
        if(md){
          wrap(md,'getUserMedia');
          const proto=Object.getPrototypeOf(md);
          if(proto)wrap(proto,'getUserMedia');
        }
        wrap(navigator,'getUserMedia',true);
        wrap(navigator,'webkitGetUserMedia',true);
        wrap(navigator,'mozGetUserMedia',true);
        const modernOk=!md||typeof md.getUserMedia!=='function'||Boolean(md.getUserMedia[marker]);
        const legacyOk=['getUserMedia','webkitGetUserMedia','mozGetUserMedia'].every(name=>
          typeof navigator[name]!=='function'||Boolean(navigator[name][marker]));
        return Boolean(modernOk&&legacyOk);
      };
      const api={
        setTalkIntent(value){talkIntent=Boolean(value);},
        hasTalkIntent(){return talkIntent;},
        install,
        isProtected:install
      };
      try{Object.defineProperty(window,key,{configurable:false,value:api});}catch(_){window[key]=api;}
      install();
    })();
  </script>
  <meta name="referrer" content="no-referrer">
  <title>Luxe EZVIZ Player</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03070a}
    #video{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
    /* High-DPI inner EZUIKit stage: the SDK paints into a larger backing canvas,
       while this transform keeps the visible player aligned with the outer viewport. */
    #video-renderer{position:absolute!important;left:0!important;top:0!important;
      transform:scale(var(--luxe-render-inverse,1));transform-origin:top left;overflow:hidden}
    /* Chromium fullscreen promotes the iframe in HA's ShadowRoot, not the
       inner HTML document. The SDK keeps its previous pixel width on #video.
       Make the visible iframe the coordinate space and override SDK dimensions
       only while that iframe is in native fullscreen. */
    html.luxe-host-fullscreen body{position:relative!important;
      height:var(--luxe-host-frame-height,100%)!important}
    html.luxe-host-fullscreen #video{
      position:absolute!important;inset:auto!important;
      left:var(--luxe-fs-video-left,0px)!important;
      top:var(--luxe-fs-video-top,0px)!important;
      width:var(--luxe-fs-video-width,100%)!important;
      height:var(--luxe-fs-video-height,100%)!important
    }
    /* WebKit can promote the inner <html> to the fullscreen top layer without
       updating the iframe layout viewport. Size the existing SDK stage from
       explicit screen geometry, with letterboxing rather than stretching. */
    html:fullscreen,html:-webkit-full-screen{position:relative!important}
    html:fullscreen #video,html:-webkit-full-screen #video{
      position:absolute!important;inset:auto!important;
      left:var(--luxe-fs-video-left,0px)!important;
      top:var(--luxe-fs-video-top,0px)!important;
      width:var(--luxe-fs-video-width,100%)!important;
      height:var(--luxe-fs-video-height,100%)!important
    }
    /* A single cached frame bridges the native fullscreen animation while
       EZUIKit resizes, in either direction. Never intercept controls. */
    #transition-frame{position:absolute;inset:0;width:100%;height:100%;
      object-fit:contain;background:#03070a;z-index:3;pointer-events:none;
      opacity:1;transition:opacity .10s ease-out}
    #transition-frame[hidden]{display:none!important}
    #shade{position:absolute;bottom:0;left:0;right:0;height:78px;z-index:4;
      background:linear-gradient(transparent,rgba(0,0,0,.48));opacity:0;pointer-events:none;
      transition:opacity .22s ease}
    #quality-switch-overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;
      background:rgba(3,7,10,.58);color:rgba(255,255,255,.82);
      font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none}
    #quality-switch-overlay[hidden]{display:none!important}
    .quality-switch-spinner{width:29px;height:29px;border-radius:50%;
      border:2px solid rgba(255,255,255,.22);border-top-color:#fff;
      animation:quality-switch-spin 1s linear infinite}
    @keyframes quality-switch-spin{to{transform:rotate(360deg)}}
    #controls{position:absolute;left:8px;right:8px;bottom:7px;
      z-index:5;display:flex;align-items:center;justify-content:space-between;
      opacity:0;visibility:hidden;transform:translateY(calc(-50% + 3px));pointer-events:none;
      transition:opacity .20s ease,transform .20s ease,visibility 0s linear .20s}
    body.live.controls-visible #controls{opacity:1;visibility:visible;transform:translateY(0);
      transition:opacity .18s ease,transform .18s ease;pointer-events:auto}
    body.live.controls-visible #shade{opacity:1}
    /* Right-side capture stack: screenshot above recording, both centered as a group. */
    #screenshot,#record{position:absolute;right:8px;z-index:5;
      opacity:0;visibility:hidden;transform:translateY(calc(-50% + 3px));pointer-events:none;
      transition:opacity .20s ease,transform .20s ease,visibility 0s linear .20s}
    #screenshot{top:calc(50% - 22px)}
    #record{top:calc(50% + 22px);color:#fff}
    body.live.controls-visible #screenshot,body.live.controls-visible #record{opacity:1;visibility:visible;
      transform:translateY(-50%);pointer-events:auto;
      transition:opacity .18s ease,transform .18s ease}
    body.recording #record{opacity:1!important;visibility:visible!important;
      transform:translateY(-50%)!important;pointer-events:auto!important;
      transition:opacity .18s ease,transform .18s ease}
    #record svg{width:23px;height:23px;stroke-width:1.98}
    #record:disabled{opacity:1;cursor:progress}
    #record .record-spinner{transform-box:view-box;transform-origin:14px 12px;
      animation:record-spin .85s linear infinite}
    #record-status{position:absolute;top:10px;right:8px;z-index:6;display:flex;align-items:center;
      gap:6px;padding:5px 8px;border:0;border-radius:8px;
      background:rgba(8,14,22,.48);color:#fff;
      font:600 12px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;
      font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    #record-status[hidden]{display:none!important}
    #record-status .record-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#ff515b}
    #record-status .record-status-spinner{width:10px;height:10px;flex:0 0 10px;
      border:1.5px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;
      animation:record-spin .85s linear infinite}
    #record-status.warning{color:#ffd08a;background:rgba(32,24,12,.56)}
    #record-status.warning .record-dot{background:#ffb547}
    #record-status.error{color:#ff858b;background:rgba(34,13,17,.58)}
    @keyframes record-spin{to{transform:rotate(360deg)}}
    body.recording #record-status{display:flex!important}
    body.recording #controls,body.recording #screenshot,body.recording #ptz-trigger,
    body.recording #ptz-panel,body.recording #ptz-dismiss,body.recording #quality-menu,
    body.recording #shade{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
    body.recording #record-status{opacity:1!important;visibility:visible!important}
    /* Card mode does not use the phone safe-area; real fullscreen does. */
    body.fullscreen-active #controls{bottom:max(7px,env(safe-area-inset-bottom))}
    .cluster{display:flex;align-items:center;gap:4px}
    .control{appearance:none;display:inline-flex;align-items:center;justify-content:center;
      flex:0 0 36px;width:36px;height:36px;margin:0;padding:0;cursor:pointer;
      color:#fff;background:transparent;border:0;border-radius:8px;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .control:disabled{opacity:.55;cursor:default}
    .control:hover,.control:focus-visible{background:rgba(255,255,255,.14)}
    .control:focus-visible{outline:2px solid rgba(255,255,255,.86);outline-offset:1px}
    .control svg{display:block;flex:none;width:22px;height:22px;stroke:currentColor;
      stroke-width:2.05;fill:none;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
    #fullscreen svg{width:22px;height:22px}
    #screenshot svg{width:23px;height:23px;stroke-width:1.98}
    #pip svg{width:26px;height:26px;stroke-width:1.75}
    #stop svg{width:24px;height:24px;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .control[hidden]{display:none!important}
    /* Keep the hidden native-media source aligned with the whole card.
       iOS fullscreen/PiP dismiss animations return to this element's box.
       A 2x2px top-left source makes the system animate back into the corner. */
    #pip-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
      opacity:0;pointer-events:none;z-index:-1}
    #sound svg{width:23px;height:23px}
    #talk svg{width:22px;height:22px}
    #talk.talk-active{background:rgba(149,72,88,.92);color:#fff}
    #talk.talk-active:hover,#talk.talk-active:focus-visible{background:rgba(165,78,96,.98)}
    /* Quality selector sits immediately left of the volume control. */
    #quality{flex:0 0 74px;width:74px;height:32px;border:1px solid rgba(236,243,252,.48);
      border-radius:18px;padding:0 7px;font:500 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(8,14,22,.3)}
    #quality[aria-expanded="true"]{background:rgba(30,48,70,.92);border-color:rgba(235,243,255,.8)}
    /* Compact menu styled after EZVIZ's official quality selector. Four common
       levels fit without a scrollbar; extra device-provided levels remain scrollable. */
    #quality-menu{position:fixed;left:8px;top:8px;right:auto;bottom:auto;z-index:9;width:104px;
      max-width:calc(100vw - 16px);max-height:min(72vh,360px);overflow:auto;padding:4px;
      display:flex;flex-direction:column;gap:2px;border:1px solid rgba(225,236,250,.12);
      border-radius:8px;background:rgba(3,5,9,.54);backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.34);
      scrollbar-width:none;-ms-overflow-style:none}
    #quality-menu::-webkit-scrollbar{display:none}
    #quality-menu[hidden]{display:none!important}
    #quality-menu-list{display:flex;flex-direction:column;gap:2px;min-width:0}
    .quality-option{appearance:none;flex:0 0 auto;width:100%;min-height:31px;padding:4px 8px;
      border:0;border-radius:6px;background:transparent;color:#edf2f9;text-align:center;
      font:14px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .quality-option:hover,.quality-option:focus-visible{background:rgba(255,255,255,.055);outline:none}
    .quality-option[aria-checked="true"]{color:#438cff;background:transparent;font-weight:600}
    .quality-option:disabled{opacity:.55;cursor:wait}
    .quality-empty{padding:12px 8px;color:#aeb9c8;text-align:center;font:12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
    /* PTZ is a focused overlay: no close button, tap outside to dismiss.
       Keep the video at its original size; do not intercept video SDK layout. */
    #ptz-trigger{position:absolute;left:8px;right:auto;top:50%;z-index:5;
      opacity:0;visibility:hidden;transform:translateY(calc(-50% + 3px));pointer-events:none;
      transition:opacity .20s ease,transform .20s ease,visibility 0s linear .20s}
    body.live.controls-visible #ptz-trigger:not([hidden]){opacity:1;visibility:visible;
      transform:translateY(-50%);pointer-events:auto}
    #ptz-trigger svg{width:23px;height:23px}
    #ptz-dismiss{position:absolute;inset:0;z-index:10;background:transparent;
      touch-action:manipulation;cursor:default}
    #ptz-panel{position:absolute;top:50%;left:8px;right:auto;z-index:11;
      width:156px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);
      box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;
      transform:translateY(-50%);padding:9px;border-radius:14px;
      background:rgba(10,18,30,.62);border:1px solid rgba(220,234,252,.15);
      backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
      box-shadow:0 5px 18px rgba(0,0,0,.22);color:#eef4fa;
      user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #ptz-panel[hidden],#ptz-dismiss[hidden]{display:none!important}
    #ptz-panel-title{font:500 12px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;
      padding:1px 1px 8px;text-align:center;color:rgba(240,245,252,.88);
      touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
    #ptz-panel-title.dragging{cursor:grabbing}
    #ptz-panel-title svg{display:inline-block;vertical-align:-2px;width:14px;height:14px;
      margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;pointer-events:none}
    #ptz-grid{display:grid;grid-template-columns:repeat(3,44px);
      grid-template-rows:repeat(3,44px);gap:2px;justify-content:center}
    .ptz-key{appearance:none;border:0;border-radius:50%;padding:0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(197,215,236,.12);color:#f2f6fc;
      touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .ptz-key svg{width:21px;height:21px;stroke:currentColor;fill:none;
      stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .ptz-key.pressed{background:rgba(47,126,223,.88)}
    .ptz-key:disabled{opacity:.32;cursor:default}
    .ptz-center{border-radius:50%;width:11px;height:11px;background:rgba(225,238,252,.32);
      align-self:center;justify-self:center}
    #ptz-tip{text-align:center;color:rgba(228,240,255,.65);
      font:10px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;padding-top:8px}
    body.ptz-open #controls,body.ptz-open #screenshot,body.ptz-open #record,body.ptz-open #ptz-trigger,
    body.ptz-open #quality-menu,body.ptz-open #toast{opacity:0!important;
      visibility:hidden!important;pointer-events:none!important}
    body.ptz-open #shade{opacity:0!important}
    @media(max-width:380px){#ptz-panel{left:5px}}
    @media(max-height:260px){#ptz-panel{width:142px;padding:6px}
      #ptz-panel-title{padding-bottom:4px}
      #ptz-grid{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}
      #ptz-tip{display:none}}
    #toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;
      max-width:92%;padding:6px 10px;border-radius:7px;background:rgba(12,20,31,.8);
      font:12px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#f0f3f8;
      pointer-events:none;opacity:0;transition:opacity .2s ease}
    #toast.on{opacity:1}
    @media(prefers-reduced-motion:reduce){#shade,#controls,#screenshot,#record,#toast{transition:none}.quality-switch-spinner{animation-duration:1.8s}}
  </style>
</head>
<body>
  <div id="video"><div id="video-renderer"></div></div>
  <canvas id="transition-frame" aria-hidden="true" hidden></canvas>
  <div id="shade" aria-hidden="true"></div>
  <div id="quality-switch-overlay" hidden aria-live="polite" aria-label="正在切换清晰度">
    <span class="quality-switch-spinner" aria-hidden="true"></span>
    <div id="quality-switch-message">正在切换清晰度…</div>
  </div>
  <div id="controls" aria-label="视频控制">
    <div class="cluster">
      <button class="control" id="fullscreen" type="button" aria-label="全屏" title="全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
      <button class="control" id="pip" type="button" aria-label="进入画中画" title="画中画（试验）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 9V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><rect x="12" y="12" width="9" height="7" rx="1"/></svg>
      </button>
      <button class="control" id="stop" type="button" aria-label="停止播放" title="停止播放">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14"/></svg>
      </button>
    </div>
    <div class="cluster">
      <button class="control" id="quality" type="button" aria-label="切换清晰度" title="切换清晰度" aria-expanded="false" aria-haspopup="menu">清晰度</button>
      <button class="control" id="talk" type="button" aria-label="开始对讲" title="开始对讲" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg>
      </button>
      <button class="control" id="sound" type="button" aria-label="开启声音" title="开启声音" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
      </button>
    </div>
  </div>
  <!-- PTZ trigger appears only after server-confirmed per-device PTZ capability. -->
  <button class="control" id="ptz-trigger" type="button" aria-label="打开云台控制" title="云台控制" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
  </button>
  <div id="ptz-dismiss" aria-label="点击画面关闭云台控制" hidden></div>
  <div id="ptz-panel" role="group" aria-label="云台方向控制" hidden>
    <div id="ptz-panel-title" aria-label="拖动云台控制面板" title="拖动以移动云台面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9h8M8 15h8"/></svg>云台控制
    </div>
    <div id="ptz-grid">
      <span></span>
      <button class="ptz-key" data-ptz="up" aria-label="向上转动"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
      <span></span>
      <button class="ptz-key" data-ptz="left" aria-label="向左转动"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
      <span class="ptz-center" aria-hidden="true"></span>
      <button class="ptz-key" data-ptz="right" aria-label="向右转动"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
      <span></span>
      <button class="ptz-key" data-ptz="down" aria-label="向下转动"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
      <span></span>
    </div>
    <div id="ptz-tip">轻点微调 · 长按持续转动</div>
  </div>
  <!-- Right-hand capture stack; screenshot remains above the local recording control. -->
  <button class="control" id="screenshot" type="button" aria-label="保存当前画面截图" title="截图">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.25 4h-4.5L7.5 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2.5z"/><circle cx="12" cy="13.5" r="3"/></svg>
  </button>
  <button class="control" id="record" type="button" aria-label="开始录像" title="开始录像" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="7" y="5" width="14" height="14" rx="2.5"/>
      <path d="M7 9 3 6.8v10.4L7 15"/>
      <circle class="record-center" cx="14" cy="12" r="2.5" fill="#fff" stroke="none"/>
    </svg>
  </button>
  <div id="record-status" hidden aria-live="polite">
    <span class="record-dot" aria-hidden="true" hidden></span>
    <span id="record-status-spinner" class="record-status-spinner" aria-hidden="true" hidden></span>
    <span id="record-status-label" hidden></span>
    <span id="record-timer" hidden>00:00</span>
  </div>
  <div id="quality-menu" role="menu" aria-label="选择视频清晰度" hidden>
    <div id="quality-menu-list"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <video id="pip-video" playsinline muted aria-hidden="true"></video>
  <script src="/luxe_ezviz/sdk/ezuikit.js"></script>
  <script>
    (() => {
      'use strict';
      const iframeOrigin = location.origin;
      let currentId = null;
      let player = null;
      let starting = false;
      let stopping = false;
      let firstFrame = false;
